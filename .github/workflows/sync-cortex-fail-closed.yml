name: Sync Córtex fail-closed site

on:
  push:
    branches:
      - deploy/fail-closed-20260903

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download frozen Córtex SITE-FIRST source
        run: |
          set -euo pipefail
          rm -rf /tmp/cortex-sync
          mkdir -p /tmp/cortex-sync
          curl -fL --retry 3 \
            https://codeload.github.com/Hennanst/cortex-sistema/tar.gz/refs/heads/revive/p0-remediation-20260829 \
            -o /tmp/cortex-sync/source.tar.gz
          tar -xzf /tmp/cortex-sync/source.tar.gz -C /tmp/cortex-sync
          SOURCE_DIR="$(find /tmp/cortex-sync -maxdepth 2 -type d -name site_output | head -n 1)"
          test -n "$SOURCE_DIR"
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"

      - name: Validate source fail-closed gate
        run: |
          set -euo pipefail
          test -f "$SOURCE_DIR/index.html"
          for route in setup-games trabalho-estudo creator-streaming casa-inteligente guias comparativos recomendados; do
            test -f "$SOURCE_DIR/$route/index.html"
          done
          if grep -Rni --include='*.html' 'tag=cortexofertas-20' "$SOURCE_DIR"; then
            echo 'BLOCK: affiliate link leaked into fail-closed source'
            exit 1
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['SOURCE_DIR'])
          state = json.loads((root/'release-state.json').read_text(encoding='utf-8'))
          assert state.get('account_code') == 'CO'
          assert str(state.get('tailwind_account_id')) == '1653454'
          assert state.get('commercial_links_enabled') is False
          print('SOURCE FAIL-CLOSED QA: PASS')
          PY

      - name: Mirror site_output into deployment repository
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a "$SOURCE_DIR"/. ./
          echo 'DEPLOY MIRROR: PASS'

      - name: Validate mirrored deployment tree
        run: |
          set -euo pipefail
          for route in setup-games trabalho-estudo creator-streaming casa-inteligente guias comparativos recomendados; do
            test -f "$route/index.html"
          done
          if grep -Rni --include='*.html' 'tag=cortexofertas-20' . --exclude-dir=.git --exclude-dir=.github; then
            echo 'BLOCK: affiliate link leaked into mirrored tree'
            exit 1
          fi
          echo 'DEPLOY TREE QA: PASS — 8 routes / affiliate href disabled'

      - name: Commit mirrored fail-closed site
        run: |
          set -euo pipefail
          git config user.name 'cortex-deploy-bot'
          git config user.email 'cortex-deploy-bot@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'DEPLOY SYNC: NO_CHANGE'
          else
            git commit -m 'deploy: mirror fail-closed architecture v2 [sync-bot]'
            git push origin HEAD:deploy/fail-closed-20260903
            echo 'DEPLOY SYNC: PASS'
          fi
