name: Preview G-IMG-01 category visuals

on:
  push:
    branches:
      - feat/premium-category-visuals-20260905
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_PAGES_PROJECT: cortex-ofertas

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build preview bundle
        run: |
          set -euo pipefail
          bash scripts/build_cloudflare_pages.sh
          python3 scripts/apply_premium_visuals.py dist

      - name: Normalize Cloudflare credentials
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          token="$(printf '%s' "$RAW_CLOUDFLARE_API_TOKEN" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          account_raw="$(printf '%s' "$RAW_CLOUDFLARE_ACCOUNT_ID" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          token="${token#Bearer }"; token="${token#bearer }"; token="${token#CLOUDFLARE_API_TOKEN=}"
          token="${token#\"}"; token="${token%\"}"; token="${token#\'}"; token="${token%\'}"
          account_raw="${account_raw#CLOUDFLARE_ACCOUNT_ID=}"
          account_raw="${account_raw#\"}"; account_raw="${account_raw%\"}"; account_raw="${account_raw#\'}"; account_raw="${account_raw%\'}"
          account="$(printf '%s' "$account_raw" | grep -Eo '[A-Fa-f0-9]{32}' | head -n1 || true)"
          if [ -z "$account" ]; then account="$account_raw"; fi
          test -n "$token"; test -n "$account"
          echo "::add-mask::$token"; echo "::add-mask::$account"
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
          printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' "$account" >> "$GITHUB_ENV"

      - name: Deploy isolated branch preview
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy dist \
            --project-name="$CLOUDFLARE_PAGES_PROJECT" \
            --branch="${GITHUB_REF_NAME}" \
            --commit-hash="${GITHUB_SHA}" | tee /tmp/wrangler-preview.log
          deploy_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.pages\.dev' /tmp/wrangler-preview.log | head -n1)"
          test -n "$deploy_url"
          printf 'DEPLOY_URL=%s\n' "$deploy_url" >> "$GITHUB_ENV"
          echo "Preview URL: ${deploy_url}"

      - name: Capture mobile and desktop visual evidence
        run: |
          set -euo pipefail
          npm install --no-save playwright@latest >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          mkdir -p visual-evidence
          node <<'NODE'
          const { chromium } = require('playwright');
          const base = process.env.DEPLOY_URL;
          const routes = [
            ['home','/'],
            ['setup','/setup-games/'],
            ['work','/trabalho-estudo/'],
            ['creator','/creator-streaming/'],
            ['home-smart','/casa-inteligente/']
          ];
          const viewports = [
            ['mobile',390,844],
            ['desktop',1440,900]
          ];
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const failures=[];
            for (const [vpName,width,height] of viewports) {
              const page = await browser.newPage({viewport:{width,height}, deviceScaleFactor:1});
              for (const [name,path] of routes) {
                const res = await page.goto(base+path,{waitUntil:'networkidle',timeout:60000});
                if (!res || !res.ok()) failures.push(`${vpName} ${path}: HTTP ${res && res.status()}`);
                await page.evaluate(async()=>{
                  for (const img of document.images) img.scrollIntoView({block:'center'});
                  window.scrollTo(0,document.body.scrollHeight);
                  await new Promise(r=>setTimeout(r,900));
                  window.scrollTo(0,0);
                  await new Promise(r=>setTimeout(r,250));
                });
                const state = await page.evaluate(()=>({
                  overflow: document.documentElement.scrollWidth > innerWidth + 2,
                  broken: [...document.images].filter(i=>!i.complete || i.naturalWidth===0).map(i=>i.currentSrc||i.src),
                  oldModels: /hero-tech-v1|category-(gaming|work|creator|home)-v1/.test(document.documentElement.innerHTML),
                  photos: [...document.images].filter(i=>(i.currentSrc||i.src).includes('images.unsplash.com')).length
                }));
                if (state.overflow) failures.push(`${vpName} ${path}: horizontal overflow`);
                if (state.broken.length) failures.push(`${vpName} ${path}: broken images ${state.broken.join(',')}`);
                if (state.oldModels) failures.push(`${vpName} ${path}: old model visual remains`);
                if (state.photos < 1) failures.push(`${vpName} ${path}: no premium photo found`);
                await page.screenshot({path:`visual-evidence/${vpName}-${name}.png`,fullPage:false});
              }
              await page.close();
            }
            await browser.close();
            require('fs').writeFileSync('visual-evidence/preview-url.txt', base+'\n');
            if (failures.length) {
              console.error(failures.join('\n'));
              process.exit(1);
            }
            console.log('G_IMG_01_CATEGORY_PREVIEW_TECHNICAL_PASS');
          })();
          NODE

      - name: Upload crop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g-img-01-category-preview
          path: visual-evidence/
          if-no-files-found: error
          retention-days: 7
