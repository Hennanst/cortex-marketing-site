name: Deploy Córtex to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

env:
  CLOUDFLARE_PAGES_PROJECT: cortex-ofertas

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build static publish directory
        run: bash scripts/build_cloudflare_pages.sh

      - name: Validate Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 whoami

      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if ! npx --yes wrangler@4 pages project list --json | jq -e --arg p "$CLOUDFLARE_PAGES_PROJECT" '.[] | select(.name == $p)' >/dev/null; then
            npx --yes wrangler@4 pages project create "$CLOUDFLARE_PAGES_PROJECT" --production-branch=main
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy dist \
            --project-name="$CLOUDFLARE_PAGES_PROJECT" \
            --branch="${GITHUB_REF_NAME}" \
            --commit-hash="${GITHUB_SHA}"

      - name: Production smoke test
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            if curl --fail --silent --show-error --location "https://${CLOUDFLARE_PAGES_PROJECT}.pages.dev/" -o /tmp/home.html \
              && curl --fail --silent --show-error --location "https://${CLOUDFLARE_PAGES_PROJECT}.pages.dev/setup-games/" -o /tmp/setup.html \
              && grep -q "Córtex Ofertas" /tmp/home.html \
              && grep -q "G305" /tmp/setup.html; then
              exit 0
            fi
            sleep 10
          done
          echo "Cloudflare Pages smoke test failed" >&2
          exit 1
