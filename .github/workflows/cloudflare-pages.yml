name: Deploy Córtex to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - migrate/cloudflare-pages-20260904

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-${{ github.ref_name }}
  cancel-in-progress: true

env:
  CLOUDFLARE_PAGES_PROJECT: cortex-ofertas

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build static publish directory
        run: bash scripts/build_cloudflare_pages.sh

      - name: Normalize Cloudflare credentials
        env:
          RAW_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RAW_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          token="$(printf '%s' "$RAW_CLOUDFLARE_API_TOKEN" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          account_raw="$(printf '%s' "$RAW_CLOUDFLARE_ACCOUNT_ID" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          token="${token#Bearer }"
          token="${token#bearer }"
          token="${token#CLOUDFLARE_API_TOKEN=}"
          token="${token#\"}"; token="${token%\"}"
          token="${token#\'}"; token="${token%\'}"
          account_raw="${account_raw#CLOUDFLARE_ACCOUNT_ID=}"
          account_raw="${account_raw#\"}"; account_raw="${account_raw%\"}"
          account_raw="${account_raw#\'}"; account_raw="${account_raw%\'}"
          account="$(printf '%s' "$account_raw" | grep -Eo '[A-Fa-f0-9]{32}' | head -n1 || true)"
          if [ -z "$account" ]; then account="$account_raw"; fi
          test -n "$token"
          test -n "$account"
          echo "::add-mask::$token"
          echo "::add-mask::$account"
          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
          printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' "$account" >> "$GITHUB_ENV"

      - name: Verify Cloudflare API token
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            https://api.cloudflare.com/client/v4/user/tokens/verify \
            -o /tmp/token-verify.json
          jq -e '.success == true and .result.status == "active"' /tmp/token-verify.json >/dev/null
          echo "Cloudflare API token is active."

      - name: Validate Cloudflare Pages account access
        run: |
          set -euo pipefail
          http_code="$(curl --silent --show-error \
            -o /tmp/cloudflare-pages-response.json \
            -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects")"
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Cloudflare Pages API returned HTTP ${http_code}." >&2
            jq -r '.errors[]? | "code=\(.code) message=\(.message)"' /tmp/cloudflare-pages-response.json >&2 || true
            exit 1
          fi
          jq -e '.success == true and (.result | type == "array")' /tmp/cloudflare-pages-response.json >/dev/null
          jq '.result' /tmp/cloudflare-pages-response.json > /tmp/cloudflare-pages-projects.json
          echo "Cloudflare Pages account access confirmed."

      - name: Ensure Pages project exists
        run: |
          set -euo pipefail
          if ! jq -e --arg p "$CLOUDFLARE_PAGES_PROJECT" '.[] | select(.name == $p)' /tmp/cloudflare-pages-projects.json >/dev/null; then
            npx --yes wrangler@4 pages project create "$CLOUDFLARE_PAGES_PROJECT" --production-branch=main
          fi

      - name: Deploy to Cloudflare Pages
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages deploy dist \
            --project-name="$CLOUDFLARE_PAGES_PROJECT" \
            --branch="${GITHUB_REF_NAME}" \
            --commit-hash="${GITHUB_SHA}" | tee /tmp/wrangler-deploy.log
          deploy_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.pages\.dev' /tmp/wrangler-deploy.log | head -n1)"
          test -n "$deploy_url"
          printf 'DEPLOY_URL=%s\n' "$deploy_url" >> "$GITHUB_ENV"
          echo "Cloudflare deployment URL: ${deploy_url}"

      - name: HTTP parity smoke test
        run: |
          set -euo pipefail
          routes=(/ /setup-games/ /trabalho-estudo/ /creator-streaming/ /casa-inteligente/ /guias/ /comparativos/ /recomendados/)
          for route in "${routes[@]}"; do
            out="/tmp/http$(echo "$route" | tr '/-' '__').html"
            curl --fail --silent --show-error --location "${DEPLOY_URL}${route}" -o "$out"
            grep -q "Córtex Ofertas" "$out"
            if grep -q "hennanst-20" "$out"; then echo "obsolete affiliate tag at $route" >&2; exit 1; fi
            if grep -q "cortex-public.vercel.app" "$out"; then echo "stale Vercel origin at $route" >&2; exit 1; fi
          done
          grep -q "G305" /tmp/http_setup_games_.html
          grep -q "cortexofertas-20" /tmp/http_setup_games_.html
          echo "HTTP parity smoke test passed."

      - name: Browser parity QA mobile and desktop
        run: |
          set -euo pipefail
          npm install --no-save playwright@latest >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
          node <<'NODE'
          const { chromium } = require('playwright');
          const deployBase = process.env.DEPLOY_URL;
          const productionBase = `https://${process.env.CLOUDFLARE_PAGES_PROJECT}.pages.dev`;
          const bases = [{name:'deployment', url:deployBase}];
          if (process.env.GITHUB_REF === 'refs/heads/main') bases.push({name:'production', url:productionBase});
          const routes = ['/', '/setup-games/', '/trabalho-estudo/', '/creator-streaming/', '/casa-inteligente/', '/guias/', '/comparativos/', '/recomendados/'];
          const viewports = [
            {name:'mobile', width:390, height:844},
            {name:'desktop', width:1440, height:900}
          ];
          (async()=>{
            const browser = await chromium.launch({headless:true});
            const failures=[];
            for (const target of bases) {
              const internal = new Set();
              for (const vp of viewports) {
                const page = await browser.newPage({viewport:{width:vp.width,height:vp.height}});
                for (const route of routes) {
                  const response = await page.goto(target.url + route,{waitUntil:'networkidle',timeout:60000});
                  if (!response || !response.ok()) failures.push(`${target.name} ${vp.name} ${route}: HTTP ${response && response.status()}`);
                  const result = await page.evaluate(({productionBase}) => {
                    const imgs=[...document.images].map(img=>({src:img.getAttribute('src'),complete:img.complete,naturalWidth:img.naturalWidth}));
                    const badImgs=imgs.filter(x=>!x.complete || x.naturalWidth===0);
                    const overflow=document.documentElement.scrollWidth > window.innerWidth + 2;
                    const html=document.documentElement.innerHTML;
                    const canonical=document.querySelector('link[rel="canonical"]')?.href || '';
                    const ctas=[...document.querySelectorAll('a')].filter(a=>/Amazon|Ver na Amazon|Ver produto/i.test(a.textContent||''));
                    const currentTagLinks=[...document.querySelectorAll('a[href*="amazon.com.br"]')].filter(a=>a.href.includes('tag=cortexofertas-20'));
                    const disclosures=[...document.querySelectorAll('body *')].filter(el=>/link de afiliado|associado da amazon|publicidade/i.test(el.textContent||'')).length;
                    const blocked=[...document.querySelectorAll('[data-merchant-state="blocked"]')].filter(el=>getComputedStyle(el).display!=='none').length;
                    const links=[...document.querySelectorAll('a[href]')].map(a=>a.getAttribute('href')).filter(Boolean);
                    return {
                      title:document.title, overflow, badImgs, images:imgs.length, ctas:ctas.length,
                      currentTagLinks:currentTagLinks.length, disclosures, blocked, canonical, links,
                      staleOrigin:html.includes('cortex-public.vercel.app'), staleTag:html.includes('hennanst-20'),
                      productionCanonical:canonical.startsWith(productionBase)
                    };
                  }, {productionBase});
                  console.log(JSON.stringify({target:target.name,viewport:vp.name,route,...result,links:undefined}));
                  if (result.overflow) failures.push(`${target.name} ${vp.name} ${route}: horizontal overflow`);
                  if (result.badImgs.length) failures.push(`${target.name} ${vp.name} ${route}: ${result.badImgs.length} broken images`);
                  if (result.staleOrigin) failures.push(`${target.name} ${vp.name} ${route}: stale Vercel origin`);
                  if (result.staleTag) failures.push(`${target.name} ${vp.name} ${route}: obsolete affiliate tag`);
                  if (!result.productionCanonical) failures.push(`${target.name} ${vp.name} ${route}: canonical not Cloudflare production`);
                  if (route==='/' && result.images < 4) failures.push(`${target.name} ${vp.name} /: expected image-led home`);
                  if (route==='/setup-games/' && result.ctas < 2) failures.push(`${target.name} ${vp.name} setup: expected >=2 merchant CTAs`);
                  if (route==='/setup-games/' && result.currentTagLinks < 2) failures.push(`${target.name} ${vp.name} setup: current affiliate tag missing`);
                  if (route==='/setup-games/' && result.disclosures < 1) failures.push(`${target.name} ${vp.name} setup: affiliate disclosure missing`);
                  if (['/creator-streaming/','/casa-inteligente/','/guias/'].includes(route) && result.images < 2) failures.push(`${target.name} ${vp.name} ${route}: primary nav route not image-led`);
                  if (['/creator-streaming/','/casa-inteligente/'].includes(route) && result.blocked > 0) failures.push(`${target.name} ${vp.name} ${route}: unfinished merchant blocks still visible`);
                  for (const href of result.links) {
                    if (href.startsWith('/')) internal.add(href.split('#')[0]);
                    else if (href.startsWith(productionBase)) internal.add(new URL(href).pathname);
                  }
                }
                await page.close();
              }
              const request = await browser.newPage();
              for (const href of [...internal].filter(Boolean).slice(0,140)) {
                try {
                  const r = await request.request.get(target.url + href, {timeout:30000});
                  if (r.status() >= 400) failures.push(`${target.name} internal link ${href}: HTTP ${r.status()}`);
                } catch (e) { failures.push(`${target.name} internal link ${href}: ${e.message}`); }
              }
              await request.close();
            }
            await browser.close();
            if (failures.length) {
              console.error('PARITY_QA_FAIL\n' + failures.join('\n'));
              process.exit(1);
            }
            console.log('PARITY_QA_PASS');
          })();
          NODE

      - name: Production smoke test
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          base="https://${CLOUDFLARE_PAGES_PROJECT}.pages.dev"
          routes=(/ /setup-games/ /trabalho-estudo/ /creator-streaming/ /casa-inteligente/ /guias/ /comparativos/ /recomendados/ /robots.txt /sitemap.xml)
          for route in "${routes[@]}"; do
            curl --fail --silent --show-error --location "${base}${route}" -o /tmp/prod-check
            if grep -q "cortex-public.vercel.app\|hennanst-20" /tmp/prod-check; then
              echo "stale production metadata at $route" >&2
              exit 1
            fi
          done
          echo "Production parity smoke test passed."
